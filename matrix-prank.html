
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Terminal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#00ff41;font-family:monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;padding:22px;max-width:700px;margin:8vh auto;background:#000d;border:1px solid #00ff41;min-height:70vh}
h1{font-size:25px;text-shadow:0 0 12px #00ff41}
#error{color:#ff3030;line-height:1.8;overflow-wrap:anywhere}
button{background:#001b09;color:#00ff41;border:1px solid #00ff41;padding:13px;margin-top:15px;font-family:monospace}
#reveal{display:none;color:#fff;font-size:22px}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<main>
<h1 id="title">SYSTEM TERMINAL</h1>
<div id="error"></div>
<button id="revealBtn" hidden>CONTINUER</button>
<div id="reveal">
😂 TU AS ÉTÉ MATRIXÉ !
<p>La blague est signée LEONEL OFFICIEL</p>
</div>
</main>
<script>
const owner=new URLSearchParams(location.search).get('mode')==='owner';
const c=document.getElementById('rain');
const x=c.getContext('2d');
let drops=[];
function resize(){
 c.width=innerWidth;c.height=innerHeight;
 drops=Array(Math.ceil(c.width/14)).fill(1);
}
function rain(){
 x.fillStyle='rgba(0,0,0,.08)';
 x.fillRect(0,0,c.width,c.height);
 x.fillStyle='#00ff41';x.font='14px monospace';
 drops.forEach((y,i)=>{
  x.fillText(Math.random()>.5?'1':'0',i*14,y*14);
  if(y*14>c.height&&Math.random()>.97)drops[i]=0;
  drops[i]++;
 });
 requestAnimationFrame(rain);
}
resize();rain();addEventListener('resize',resize);

const error=document.getElementById('error');
if(owner){
 document.getElementById('title').textContent='LEONEL OFFICIEL // MATRIX';
 error.textContent='[SYSTEM] Terminal prête\\n[STATUS] Connexion locale active';
 document.getElementById('revealBtn').hidden=false;
}else{
 document.getElementById('title').textContent='⚠ SYSTEM ERROR';
 const lines=[
  '[ERROR] Initialisation du système...',
  '[WARNING] Vérification en cours...',
  '[ERROR] Anomalie détectée',
  '[ERROR] Accès refusé',
  '[WARNING] Analyse du terminal...',
  '[ERROR] SYSTEM FAILURE'
 ];
 let i=0;
 function show(){
  if(i<lines.length){
   error.textContent+=lines[i]+'\\n';
   i++;
   setTimeout(show,900);
  }else{
   document.getElementById('revealBtn').hidden=false;
  }
 }
 show();
}
document.getElementById('revealBtn').onclick=()=>{
 document.getElementById('reveal').style.display='block';
 document.getElementById('revealBtn').hidden=true;
};
</script>
</body>
</html>
